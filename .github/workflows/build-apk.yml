name: Gerar APK Android (mundo calmo)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças e instalar plataforma Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências e gerar build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sincronizar projeto Android com Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar arquivo mundo-calmo.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mundo-calmo.apk

      - name: Disponibilizar mundo-calmo.apk para download
        uses: actions/upload-artifact@v4
        with:
          name: mundo-calmo-apk
          path: mundo-calmo.apk
          retention-days: 30
